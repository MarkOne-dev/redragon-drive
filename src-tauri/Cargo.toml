[package]
name = "redragon-app"
version = "0.1.0"
edition = "2021"
description = "High-performance gaming mouse management suite for Redragon M916-PRO"

[lib]
name = "redragon_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hidapi = "2.6"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "redragon-app"
path = "src/main.rs"
